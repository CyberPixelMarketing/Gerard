<!DOCTYPE html>
<!--
================================================================================
  GERARD CAFE  |  IN-RESTAURANT DIGITAL MENU  |  Cyber Pixel (cyberpixel.ae)
================================================================================

  This is a VIEW-ONLY menu for use inside the restaurant.
  There is no cart, no checkout, no WhatsApp ordering and no contact form.
  Guests browse the menu, look at the photos, and see the price.
  هذه قائمة للعرض فقط داخل المطعم. لا يوجد سلة شراء ولا طلب ولا واتساب.

  HOW TO EDIT  |  كيفية التعديل
  --------------------------------------------------------------------------
  Everything lives in three blocks in the code section near the bottom.
  Search this file for the block name you need:

     ===== CONFIG =====   name, currency, colours   | الاسم والعملة والألوان
     ===== IMAGES =====   one photo per item        | صورة لكل صنف
     ===== MENU =====     the whole menu            | القائمة كاملة

  ADDING PHOTOS  |  إضافة الصور
  --------------------------------------------------------------------------
  In the IMAGES block each line is:   "Exact English item name": "photo URL",
  The English name must match the MENU line EXACTLY, letter for letter.
  Any item with no photo shows a clean illustrated card instead, so the menu
  always looks finished. You can add photos a few at a time.
  يجب أن يطابق الاسم الإنجليزي في IMAGES الاسم في MENU تماماً.
  الأصناف بدون صورة تظهر ببطاقة مرسومة أنيقة.

  You can point at photos two ways | يمكنك استخدام طريقتين للصور:
    1. A web address, e.g. "https://.../kunafa.jpg"
    2. A local file next to this one, e.g. "img/kunafa.jpg"
       Local files are STRONGLY recommended for a screen inside the
       restaurant, because they keep working if the internet drops.
       يُفضّل بشدة استخدام ملفات محلية لأنها تعمل بدون إنترنت.

  LOGO  |  الشعار
  --------------------------------------------------------------------------
  Put logo.png next to this file. If it is missing the name shows as text.

  LANGUAGE  |  اللغة
  --------------------------------------------------------------------------
  Opens in the browser language, remembers the choice, and there is a toggle
  at the top. Direct links: ?lang=ar and ?lang=en

  KIOSK TIP  |  ملاحظة للشاشة
  --------------------------------------------------------------------------
  On a tablet, open this file in the browser and choose "Add to Home Screen"
  to run it full screen with no address bar.

================================================================================
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerard Cafe | Menu</title>
<meta name="description" content="The full Gerard Cafe menu: breakfast, salads, burgers, pasta and pizza, cake, cheesecake, kunafa, ice cream, milkshakes, juices and coffee.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241A15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#241A15; --espresso-2:#31241C;
  --cream:#F7F1E7; --cream-2:#EFE5D6;
  --gold:#C8973F; --gold-deep:#8A6614;
  --ink:#1A120E; --muted:#7C6A5D; --line:rgba(200,151,63,.22);
  --f-display:'Fraunces',Georgia,serif; --f-body:'Cairo',system-ui,sans-serif;
  --head-h:132px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head-h) + 12px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:18px}
.display{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.05}
html[dir="rtl"] .display{font-family:var(--f-body);font-weight:900;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- HEADER ---------- */
.hd{position:fixed;inset-inline:0;top:0;z-index:80;background:var(--espresso);
  border-bottom:1px solid rgba(200,151,63,.2)}
.hd-top{display:flex;align-items:center;gap:12px;height:66px}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.logo img{height:38px;width:auto}
.logo b{font-family:var(--f-display);color:var(--cream);font-size:18px;letter-spacing:.05em;white-space:nowrap}
html[dir="rtl"] .logo b{font-family:var(--f-body);font-weight:900;letter-spacing:0}
.lang{display:flex;align-items:center;gap:6px;border:1px solid rgba(200,151,63,.5);
  color:var(--gold);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;flex:none}
.lang:hover{background:var(--gold);color:var(--espresso)}
.srch{display:flex;align-items:center;gap:9px;background:rgba(247,241,231,.08);
  border:1px solid rgba(200,151,63,.28);border-radius:999px;padding:9px 15px;
  flex:1;max-width:340px;min-width:0}
.srch svg{width:17px;height:17px;color:var(--gold);flex:none}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;
  font-size:15px;color:var(--cream)}
.srch input::placeholder{color:rgba(247,241,231,.45)}
@media(max-width:620px){ .srch{order:3;flex-basis:100%;max-width:none;margin-bottom:10px} .hd-top{height:auto;padding-top:12px;flex-wrap:wrap} }

/* category tabs */
.tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid rgba(200,151,63,.32);border-radius:999px;padding:9px 16px;
  font-size:13.5px;font-weight:700;color:rgba(247,241,231,.72);white-space:nowrap;transition:.2s}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--espresso)}

/* ---------- MENU ---------- */
main{padding-top:calc(var(--head-h) + 26px);padding-bottom:70px}
.cat{margin-bottom:52px;scroll-margin-top:calc(var(--head-h) + 16px)}
.cat-h{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.cat-h .ic{width:48px;height:48px;border-radius:14px;background:var(--espresso);
  color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.cat-h .ic svg{width:25px;height:25px}
.cat-h h2{margin:0;font-size:clamp(23px,4.2vw,34px)}
.cat-h .n{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.cat-h::after{content:"";flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;text-align:start;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 38px -20px rgba(36,26,21,.45)}
.ph{position:relative;aspect-ratio:1/1;background:var(--cream-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.ph .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--cream-2),#e2d3bd)}
.ph .fallback svg{width:44%;height:44%;color:var(--gold-deep);opacity:.5}
.cbody{padding:13px 14px 15px;display:flex;flex-direction:column;gap:3px;flex:1}
.cbody b{font-size:14.5px;font-weight:700;line-height:1.35}
.cbody i{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.4}
.cbody .pr{margin-top:auto;padding-top:9px;font-family:var(--f-display);font-weight:800;
  font-size:19px;color:var(--gold-deep)}
html[dir="rtl"] .cbody .pr{font-family:var(--f-body);font-weight:900}
.cbody .pr span{font-size:11.5px;font-weight:700;font-family:var(--f-body);opacity:.75}

.empty{padding:70px 20px;text-align:center;color:var(--muted);font-size:17px}

/* ---------- DETAIL OVERLAY ---------- */
.ov{position:fixed;inset:0;z-index:120;background:rgba(26,18,14,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ov-in{background:var(--cream);border-radius:20px;overflow:hidden;max-width:440px;width:100%;
  max-height:90svh;overflow-y:auto;animation:rise .3s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.ov-ph{aspect-ratio:4/3;background:var(--cream-2);position:relative}
.ov-ph img{width:100%;height:100%;object-fit:cover}
.ov-bd{padding:22px 24px 26px}
.ov-bd h3{margin:0 0 4px;font-size:21px;line-height:1.3}
.ov-bd p{margin:0;color:var(--muted);font-size:15px}
.ov-d{margin-top:12px!important;padding-top:12px;border-top:1px solid var(--line);
  color:#3d2f26!important;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.ov-bd .pr{margin-top:16px;font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--gold-deep)}
html[dir="rtl"] .ov-bd .pr{font-family:var(--f-body);font-weight:900}
.ov-bd .pr span{font-size:14px;font-weight:700;font-family:var(--f-body)}
.ov-x{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;
  background:rgba(26,18,14,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.ov-x svg{width:20px;height:20px}

/* ---------- FOOTER / TOP ---------- */
.ft{background:var(--espresso);color:rgba(247,241,231,.55);text-align:center;
  padding:26px 18px;font-size:13px}
.top{position:fixed;inset-inline-end:16px;bottom:16px;z-index:70;width:48px;height:48px;
  border-radius:50%;background:var(--espresso);color:var(--gold);display:none;
  align-items:center;justify-content:center;box-shadow:0 10px 26px -10px rgba(36,26,21,.7)}
.top.on{display:flex}
.top svg{width:22px;height:22px}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="hd">
  <div class="wrap">
    <div class="hd-top">
      <span class="logo">
        <img src="logo.png" alt="" onerror="this.remove()">
        <b id="brandName">GERARD CAFE</b>
      </span>
      <label class="srch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" aria-label="Search">
      </label>
      <button class="lang" id="langBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
        <span id="langTxt">العربية</span>
      </button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main><div class="wrap"><div id="menu"></div><div class="empty" id="empty" hidden></div></div></main>

<footer class="ft"><span id="foot"></span></footer>

<button class="top" id="top" aria-label="Top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>

<div class="ov" id="ov">
  <div class="ov-in">
    <div class="ov-ph" id="ovPh">
      <button class="ov-x" id="ovX" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="ov-bd"><h3 id="ovT"></h3><p id="ovS"></p><p id="ovD" class="ov-d" hidden></p><div class="pr" id="ovP"></div></div>
  </div>
</div>

<script>
/* ==========================================================================
   ALL MENU CONTENT LIVES IN  menu-data.json  (next to this file).
   Do not edit this file to change the menu. Open  admin.html  instead.
   كل محتوى القائمة في ملف menu-data.json — استخدم صفحة admin.html للتعديل
   ========================================================================== */
let CONFIG={name:"GERARD CAFE",nameAr:"كافيه جيرارد",currency:"AED",currencyAr:"د.إ"};
let COLOURS={espresso:"#241A15",espresso2:"#31241C",cream:"#F7F1E7",cream2:"#EFE5D6",gold:"#C8973F",goldDeep:"#8A6614"};
let MENU=[];

/* ==========================================================================
   ===== TEXT =====   interface wording  |  نصوص الواجهة
   ========================================================================== */
const T = {
  en:{ all:"All", search:"Search the menu", items:"items", none:"Nothing matched your search.", tap:"Tap any dish to see it larger" },
  ar:{ all:"الكل", search:"ابحث في القائمة", items:"صنف", none:"لا توجد نتائج مطابقة لبحثك.", tap:"اضغط أي صنف لعرضه بحجم أكبر" }
};

/* ==========================================================================
   ===== ENGINE =====   no need to edit below  |  لا حاجة للتعديل بعد هنا
   ========================================================================== */
(function(){
"use strict";
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
let lang="en", cat="all", q="";

const S=(d)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const ICON={
 egg:S('<path d="M12 3c3.3 0 6 4.4 6 8.4A6 6 0 016 11.4C6 7.4 8.7 3 12 3z"/>'),
 leaf:S('<path d="M4 20c0-8 6-14 16-15 0 10-5.5 15-13 15H4z"/><path d="M4 20c3-5 7-8 11-9.5"/>'),
 burger:S('<path d="M4 9a8 8 0 0116 0"/><path d="M3 13h18"/><path d="M4 16h16a2 2 0 01-2 3H6a2 2 0 01-2-3z"/>'),
 pizza:S('<path d="M12 3l9 17H3z"/><circle cx="10" cy="13" r="1"/><circle cx="14" cy="16" r="1"/>'),
 cake:S('<path d="M4 20h16v-6H4z"/><path d="M4 14c2-2 3.3 2 5.3 0S13 12 15 14s3-2 5 0"/><path d="M12 4v4M8 5v3M16 5v3"/>'),
 slice:S('<path d="M3 18l9-13 9 13z"/><path d="M6 14h12"/>'),
 cookie:S('<circle cx="12" cy="12" r="9"/><circle cx="9.5" cy="10" r=".9" fill="currentColor"/><circle cx="14" cy="9" r=".9" fill="currentColor"/><circle cx="13" cy="15" r=".9" fill="currentColor"/>'),
 pancake:S('<ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v3c0 1.7 3.6 3 8 3s8-1.3 8-3V8"/><path d="M4 13v3c0 1.7 3.6 3 8 3s8-1.3 8-3v-3"/>'),
 kunafa:S('<path d="M3 16a9 5 0 0118 0z"/><path d="M5 12h14M6 9h12M8 6h8"/>'),
 icecream:S('<path d="M8 10a4 4 0 018 0"/><path d="M7 11h10l-5 10z"/>'),
 fruit:S('<circle cx="12" cy="14" r="7"/><path d="M12 7c0-2 1.5-4 4-4"/>'),
 shake:S('<path d="M7 8h10l-1 12H8z"/><path d="M6 8a6 6 0 0112 0"/><path d="M12 3v2"/>'),
 smoothie:S('<path d="M6 7h12l-2 13H8z"/><path d="M10 4l1 3M15 4l-1 3"/>'),
 mojito:S('<path d="M4 6h16l-8 8z"/><path d="M12 14v6M9 20h6"/>'),
 frappe:S('<path d="M7 9h10l-1 11H8z"/><path d="M7 9a5 5 0 0110 0"/><path d="M12 3v3"/>'),
 juice:S('<path d="M8 8h8l-1 12H9z"/><path d="M9 8V5h6v3"/><path d="M14 2l2 2"/>'),
 bubble:S('<path d="M7 8h10l-1 12H8z"/><path d="M6 8h12"/><circle cx="11" cy="16" r="1" fill="currentColor"/><circle cx="14" cy="17" r="1" fill="currentColor"/>'),
 icecoffee:S('<path d="M7 8h10l-1 12H8z"/><path d="M10 11l4 6M14 11l-4 6"/>'),
 coffee:S('<path d="M4 8h13v6a5 5 0 01-5 5H9a5 5 0 01-5-5z"/><path d="M17 9h1.5a2.5 2.5 0 010 5H17"/><path d="M8 2v3M12 2v3"/>')
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tx=k=>T[lang][k];
const cur=()=>lang==="ar"?CONFIG.currencyAr:CONFIG.currency;
const nm=o=>lang==="ar"?o.ar:o.en;
const alt=o=>lang==="ar"?o.en:o.ar;
const img=it=>it.img||null;

/* colours */
function applyColours(){const r=document.documentElement.style,c=COLOURS;
 r.setProperty("--espresso",c.espresso);r.setProperty("--espresso-2",c.espresso2);
 r.setProperty("--cream",c.cream);r.setProperty("--cream-2",c.cream2);
 r.setProperty("--gold",c.gold);r.setProperty("--gold-deep",c.goldDeep);
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=c.espresso;}

/* language */
function detect(){
  const u=new URLSearchParams(location.search).get("lang");
  if(u==="ar"||u==="en")return u;
  const p=location.pathname.toLowerCase();
  if(/(^|\/)ar\/?$/.test(p))return "ar";
  if(/(^|\/)en\/?$/.test(p))return "en";
  if(location.hash==="#ar")return "ar"; if(location.hash==="#en")return "en";
  try{const s=localStorage.getItem("gerard_menu_lang");if(s)return s;}catch(e){}
  return (navigator.languages||[navigator.language||"en"]).some(l=>/^ar\b/i.test(l))?"ar":"en";
}
function setLang(L,save){
  lang=L;
  const h=document.documentElement; h.lang=L; h.dir=L==="ar"?"rtl":"ltr";
  if(save){try{localStorage.setItem("gerard_menu_lang",L);}catch(e){}}
  $("#langTxt").textContent = L==="ar"?"EN":"العربية";
  $("#brandName").textContent = L==="ar"?CONFIG.nameAr:CONFIG.name;
  $("#q").placeholder = tx("search");
  document.title = (L==="ar"?CONFIG.nameAr:CONFIG.name)+" | "+(L==="ar"?"القائمة":"Menu");
  $("#foot").textContent = "© "+new Date().getFullYear()+" "+(L==="ar"?CONFIG.nameAr:CONFIG.name)+" · "+tx("tap");
  drawTabs(); drawMenu(); apply();
}

function drawTabs(){
  $("#tabs").innerHTML='<button class="tab'+(cat==="all"?" on":"")+'" data-c="all">'+esc(tx("all"))+'</button>'+
    MENU.map(c=>'<button class="tab'+(cat===c.slug?" on":"")+'" data-c="'+c.slug+'">'+esc(lang==="ar"?c.ar:c.en)+'</button>').join("");
  $$("#tabs .tab").forEach(b=>b.onclick=()=>{
    cat=b.dataset.c;
    $$("#tabs .tab").forEach(x=>x.classList.toggle("on",x===b));
    apply();
    if(cat!=="all"){const el=document.getElementById("c-"+cat); if(el)el.scrollIntoView({block:"start"});}
    else window.scrollTo({top:0});
  });
}

function drawMenu(){
  $("#menu").innerHTML = MENU.map(c=>{
    const cards=c.items.map((it,i)=>{
      const src=img(it);
      const ph = src
        ? '<img src="'+esc(src)+'" alt="'+esc(nm(it))+'" loading="lazy" onerror="this.parentNode.innerHTML=this.parentNode.dataset.fb">'
        : '';
      const fb='<span class="fallback">'+(ICON[c.icon]||ICON.coffee)+'</span>';
      return '<button class="card rv" data-cat="'+c.slug+'" data-i="'+i+'" data-s="'+esc((it.en+" "+it.ar).toLowerCase())+'">'+
        '<span class="ph" data-fb="'+esc(fb)+'">'+(ph||fb)+'</span>'+
        '<span class="cbody"><b>'+esc(nm(it))+'</b><i>'+esc(alt(it))+'</i>'+
        '<span class="pr">'+it.p+' <span>'+esc(cur())+'</span></span></span></button>';
    }).join("");
    return '<section class="cat" id="c-'+c.slug+'" data-c="'+c.slug+'">'+
      '<div class="cat-h"><span class="ic">'+(ICON[c.icon]||ICON.coffee)+'</span>'+
      '<h2 class="display">'+esc(lang==="ar"?c.ar:c.en)+'</h2>'+
      '<span class="n">'+c.items.length+' '+esc(tx("items"))+'</span></div>'+
      '<div class="grid">'+cards+'</div></section>';
  }).join("");
  $("#empty").textContent = tx("none");
  $$(".card").forEach(b=>b.onclick=()=>open(b.dataset.cat,+b.dataset.i));
  reveal();
}

function apply(){
  const s=q.trim().toLowerCase(); let shown=0;
  $$(".cat").forEach(sec=>{
    const catOk = cat==="all" || sec.dataset.c===cat;
    let n=0;
    $$(".card",sec).forEach(c=>{
      const ok = catOk && (!s || c.dataset.s.includes(s));
      c.style.display = ok?"":"none"; if(ok)n++;
    });
    sec.style.display = n?"":"none"; shown+=n;
  });
  $("#empty").hidden = shown>0;
}

function open(slug,i){
  const c=MENU.find(x=>x.slug===slug); if(!c)return;
  const it=c.items[i]; if(!it)return;
  const src=img(it);
  const ph=$("#ovPh");
  [...ph.querySelectorAll("img,.fallback")].forEach(n=>n.remove());
  if(src){
    const im=document.createElement("img");
    im.src=src; im.alt=nm(it);
    im.onerror=()=>{im.remove();ph.insertAdjacentHTML("afterbegin",'<span class="fallback">'+(ICON[c.icon]||ICON.coffee)+'</span>');};
    ph.insertAdjacentElement("afterbegin",im);
  } else {
    ph.insertAdjacentHTML("afterbegin",'<span class="fallback">'+(ICON[c.icon]||ICON.coffee)+'</span>');
  }
  $("#ovT").textContent=nm(it);
  $("#ovS").textContent=alt(it);
  const dsc = lang==="ar" ? (it.dAr||it.d||"") : (it.d||it.dAr||"");
  $("#ovD").textContent=dsc;
  $("#ovD").hidden=!dsc;
  $("#ovP").innerHTML=it.p+' <span>'+esc(cur())+'</span>';
  $("#ov").classList.add("on");
  document.body.style.overflow="hidden";
}
function close(){$("#ov").classList.remove("on");document.body.style.overflow="";}
$("#ovX").onclick=close;
$("#ov").onclick=e=>{if(e.target===$("#ov"))close();};
addEventListener("keydown",e=>{if(e.key==="Escape")close();});

function reveal(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
  }),{threshold:.05,rootMargin:"0px 0px -30px"});
  $$(".rv").forEach(el=>io.observe(el));
}

$("#langBtn").onclick=()=>setLang(lang==="ar"?"en":"ar",true);
$("#q").addEventListener("input",e=>{q=e.target.value;apply();});
addEventListener("scroll",()=>$("#top").classList.toggle("on",scrollY>700),{passive:true});
$("#top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

/* keep the sticky header height in sync with its real height */
function headH(){document.documentElement.style.setProperty("--head-h",$(".hd").offsetHeight+"px");}
addEventListener("resize",headH);

function fatal(msg){
  document.querySelector("main .wrap").innerHTML=
    '<div class="empty"><b>'+esc(msg)+'</b><br><span style="font-size:14px">'+
    'menu-data.json could not be loaded. If you opened this file directly from a folder, '+
    'put it online or run a local server, because browsers block file reads for safety.</span></div>';
}
async function boot(){
  let data=null,live=false;
  try{
    const r=await fetch("menu-data.json?v="+Date.now(),{cache:"no-store"});
    if(r.ok){ data=await r.json(); live=true; }
  }catch(e){}
  if(live){ try{localStorage.setItem("gerard_menu_cache",JSON.stringify(data));}catch(e){} }
  else { try{ data=JSON.parse(localStorage.getItem("gerard_menu_cache")||"null"); }catch(e){} }
  if(!data||!Array.isArray(data.categories)||!data.categories.length){ fatal("Menu unavailable"); return; }
  if(data.config)  CONFIG=Object.assign(CONFIG,data.config);
  if(data.colours) COLOURS=Object.assign(COLOURS,data.colours);
  MENU=data.categories;
  applyColours();
  setLang(detect(),false);
  headH();
}
boot();
})();
</script>
</body>
</html>
